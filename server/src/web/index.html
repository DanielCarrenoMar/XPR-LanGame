<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Admin Server</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <h1>Dashboard</h1>
        <nav class="nav">
          <a class="nav-link active" href="/">Dashboard</a>
          <a class="nav-link" href="/connected.html">Detalle de Jugadores</a>
          <a class="nav-link" href="/leaderboard.html">LeaderBoard</a>
        </nav>
      </header>

      <section class="card">
        <h2>Control de partida</h2>
        <div class="actions">
          <button class="battle-btn" id="battle-btn" type="button">Iniciar partida</button>
          <button class="reset-btn" id="reset-btn" type="button">Reiniciar variables</button>
        </div>
        <p class="timer" id="battle-timer">Tiempo activo: 00:00</p>
        <p class="status" id="status"></p>
      </section>

      <section class="card">
        <h2>Jugadores conectados</h2>
        <p class="meta" id="connected-count">Conectados: 0</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>FrontModule</th>
                <th>BackModule</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="players-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
